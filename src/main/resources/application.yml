spring:
  application:
    name: son
    
  devtools:
    restart:
      enabled: true
          
  # H2 데이터베이스 설정
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/testdb;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1
    username: son
    password: son
    
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    
  # 타임리프 설정
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    
  h2:
    console:
      enabled: true
      path: /h2-console
    
# 로깅 설정
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace 
    kr.co.suncompany.son: debug
    
